[project]
name = "recsys-genai"
version = "0.1.0"
description = "Recommender Systems in the Age of Generative AI - ML Prague 2026 Workshop"
readme = "README.md"
authors = [
    { name = "Jan Kislinger", email = "jan.kislinger@gmail.com" }
]

requires-python = ">=3.14"
dependencies = [
    "click~=8.1",
    "dvc~=3.0",
    "einops~=0.8",
    "jupyterlab~=4.5",
    "jupyterlab-quarto~=0.3",
    "jupytext>=1.19.1",
    "numpy~=2.4",
    "ollama~=0.4",
    "plotnine~=0.15",
    "polars[pyarrow]~=1.39",
    "quarto-cli~=1.9",
    "scikit-learn~=1.8",
    "scipy~=1.17",
    "torch~=2.11",
    "transformers~=5.4",
]

[project.scripts]
recsys-genai = "recsys_genai.cli:cli"

[project.optional-dependencies]
dev = [
    "nbconvert>=7.11.0",
    "nbformat>=5.9.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "N803",  # Argument name should be lowercase
    "N806",  # Variable in function should be lowercase
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
