project:
  type: website
  output-dir: _site/docs
  render:
    - "index.qmd"
    - "references.qmd"
    - "slides/*.qmd"
    - "notebooks/*.qmd"

website:
  title: "RecSys GenAI Workshop"
  favicon: assets/favicon.svg
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Slides"
        menu:
          - text: "Introduction"
            href: slides/00_introduction.qmd
          - text: "---"
          - text: "I.a: Foundations"
            href: slides/01a_foundations.qmd
          - text: "I.b: EASE"
            href: slides/01b_ease.qmd
          - text: "---"
          - text: "II.a: Transformer Architecture"
            href: slides/02a_transformer_architecture.qmd
          - text: "II.b: Transformers & SASRec"
            href: slides/02b_transformer_recommendation.qmd
          - text: "---"
          - text: "IV.a: Reranking & Slate Optimization"
            href: slides/04a_reranking.qmd
          - text: "IV.b: Generative Pages"
            href: slides/04b_generative_pages.qmd
          - text: "---"
          - text: "Wrap-up"
            href: slides/05_wrapup.qmd
      - text: "Notebooks"
        menu:
          - text: "I.a: MovieLens Dataset"
            href: notebooks/01a_movielens.qmd
          - text: "I.b: EASE"
            href: notebooks/01b_ease.qmd
          - text: "---"
          - text: "II: SASRec"
            href: notebooks/02_sasrec.qmd
          - text: "---"
          - text: "III.a: LLMs for Recommendation"
            href: notebooks/03a_llm_recommendation.qmd
          - text: "III.b: Conversational Recommendation"
            href: notebooks/03b_conversational_recommendation.qmd
          - text: "---"
          - text: "IV.a: Slate Generation"
            href: notebooks/04a_slate_generation.qmd
      - text: "References"
        href: references.qmd
    right:
      - icon: github
        href: https://github.com/jankislinger/recsys-genai
  page-footer:
    left: |
      ML Prague 2026 Workshop
    center: |
      Built with [Quarto](https://quarto.org/)
    right: |
      [GitHub](https://github.com/jankislinger/recsys-genai)

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

format:
  html:
    theme:
      - journal
      - custom.scss
    code-fold: true
    code-summary: "Show code"
    toc: true
    link-external-newwindow: true

  revealjs:
    theme: white
    slide-number: true
    code-line-numbers: false
    smaller: true

execute:
  freeze: auto
